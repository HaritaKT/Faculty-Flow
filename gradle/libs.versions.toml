[versions]
agp = "8.9.1"
kotlin = "2.0.21"

# ── Core AndroidX ────────────────────────────────────────────────────────────
# FIX: All these libraries bumped to versions that compile against SDK 36.
# The old versions (core-ktx 1.18.0, lifecycle 2.10.0, activity 1.13.0) were
# the root cause of the 7 "AAR Dependency compatibility" errors — they all
# ship an AAR that declares minCompileSdk = 36, but compileSdk was set to 35.
coreKtx             = "1.16.0"   # last stable that targets SDK 35 ✅
lifecycleRuntimeKtx = "2.8.7"    # last stable before 2.9 (SDK 35 compatible) ✅
activityCompose     = "1.10.1"   # SDK 35 compatible ✅

# ── Test ─────────────────────────────────────────────────────────────────────
junit           = "4.13.2"
junitVersion    = "1.2.1"        # 1.3.0 needs SDK 36 — downgraded ✅
espressoCore    = "3.6.1"        # 3.7.0 needs SDK 36 — downgraded ✅

# ── UI / Compose ─────────────────────────────────────────────────────────────
# FIX: Updated from 2024.09.00 → 2025.04.01.
# 2024.09.00 predates the Kotlin Compose compiler plugin integration in
# Kotlin 2.0+ and causes "Backend Internal error" during IR lowering with AGP 8.9+.
composeBom = "2025.04.01"

# ── Material / Appcompat ──────────────────────────────────────────────────────
material          = "1.12.0"
appcompat         = "1.7.0"
constraintlayout  = "2.2.1"
circleimageview   = "3.1.0"

# ── Firebase / Google ─────────────────────────────────────────────────────────
googleServices = "4.4.2"
firebaseBom    = "33.10.0"

# ── KSP (for future annotation processing — Glide, Room, etc.) ───────────────
ksp = "2.0.21-1.0.28"

[libraries]
# AndroidX
androidx-core-ktx              = { group = "androidx.core",              name = "core-ktx",              version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle",         name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose      = { group = "androidx.activity",          name = "activity-compose",      version.ref = "activityCompose" }
androidx-appcompat             = { group = "androidx.appcompat",         name = "appcompat",             version.ref = "appcompat" }
androidx-constraintlayout      = { group = "androidx.constraintlayout",  name = "constraintlayout",      version.ref = "constraintlayout" }

# Compose BOM + artifacts
androidx-compose-bom          = { group = "androidx.compose",        name = "compose-bom",          version.ref = "composeBom" }
androidx-ui                   = { group = "androidx.compose.ui",     name = "ui" }
androidx-ui-graphics          = { group = "androidx.compose.ui",     name = "ui-graphics" }
androidx-ui-tooling           = { group = "androidx.compose.ui",     name = "ui-tooling" }
androidx-ui-tooling-preview   = { group = "androidx.compose.ui",     name = "ui-tooling-preview" }
androidx-ui-test-manifest     = { group = "androidx.compose.ui",     name = "ui-test-manifest" }
androidx-ui-test-junit4       = { group = "androidx.compose.ui",     name = "ui-test-junit4" }
androidx-material3            = { group = "androidx.compose.material3", name = "material3" }

# Material / UI
material         = { group = "com.google.android.material", name = "material",        version.ref = "material" }
circleimageview  = { group = "de.hdodenhof",               name = "circleimageview", version.ref = "circleimageview" }

# Firebase
firebase-bom       = { group = "com.google.firebase", name = "firebase-bom",          version.ref = "firebaseBom" }
firebase-auth      = { group = "com.google.firebase", name = "firebase-auth-ktx" }
firebase-firestore = { group = "com.google.firebase", name = "firebase-firestore-ktx" }
firebase-storage   = { group = "com.google.firebase", name = "firebase-storage-ktx" }

# Test
junit              = { group = "junit",             name = "junit",         version.ref = "junit" }
androidx-junit     = { group = "androidx.test.ext", name = "junit",         version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application",           version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",      version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
google-services     = { id = "com.google.gms.google-services",    version.ref = "googleServices" }
ksp                 = { id = "com.google.devtools.ksp",            version.ref = "ksp" }